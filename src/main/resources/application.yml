spring:
  application:
    name: weeklyreport
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:6868/weeklyreport?reWriteBatchedInserts=true}
    username: ${SPRING_DATASOURCE_USERNAME:weeklyreport}
    password: ${SPRING_DATASOURCE_PASSWORD:weeklyreport}
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST:mail.inkar.kz}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USER:weekly-report@inkar.kz}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 15000
          timeout: 30000
          writetimeout: 15000
          ssl:
            enable: ${SMTP_SECURE:true}
            # Обязательно оставлять true - иначе JavaMail не проверяет, что имя сервера в
            # SSL-сертификате совпадает с SMTP_HOST (без этого TLS-соединение защищено от
            # прослушивания, но не от подмены сервера).
            checkserveridentity: true

telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    source-channel-id: ${TELEGRAM_SOURCE_CHANNEL_ID}
    report-chat-id: ${TELEGRAM_REPORT_CHAT_ID}

weekly-report:
  cron: ${WEEKLY_REPORT_CRON:0 0 9 * * MON}
  timezone: ${WEEKLY_REPORT_TIMEZONE:Asia/Almaty}
  divisions-path: ${DIVISIONS_FILE_PATH}
  daribar-crosswalk-path: ${DARIBAR_CROSSWALK_PATH}
  email:
    recipients: ${WEEKLY_REPORT_EMAIL_RECIPIENTS:}

ingestion-watchdog:
  max-silence: ${INGESTION_WATCHDOG_MAX_SILENCE:26h}
  check-interval: ${INGESTION_WATCHDOG_CHECK_INTERVAL:1h}

logging:
  level:
    ai.lab.weeklyreport: INFO
